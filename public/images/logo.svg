<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <!-- Magenta Glow Filter -->
    <filter id="magentaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.6" />
    </filter>

    <!-- Brand Rose / Magenta Gradient -->
    <linearGradient id="brandMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fce7f3" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Shiny White to Pink Lettering Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Delicate Gold Script Stroke Gradient -->
    <linearGradient id="goldScriptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- ==========================================
         LEFT MONOGRAM (TALL INTERLOCKING SF / SSF)
         ========================================== -->
    <g transform="translate(10, 10)">
      <!-- Backlight Aura for Monogram -->
      <ellipse cx="58" cy="72" rx="45" ry="58" fill="#d946ef" opacity="0.22" filter="url(#softGlow)" />
      
      <!-- Magenta Outer Glow Silhouette -->
      <text
        x="20"
        y="120"
        font-family="'Playfair Display', 'Bodoni MT', Georgia, serif"
        font-size="125"
        font-weight="700"
        fill="none"
        stroke="#f43f5e"
        stroke-width="5"
        stroke-opacity="0.8"
        filter="url(#magentaGlow)"
      >S</text>

      <text
        x="62"
        y="120"
        font-family="'Playfair Display', 'Bodoni MT', Georgia, serif"
        font-size="125"
        font-weight="700"
        fill="none"
        stroke="#d946ef"
        stroke-width="5"
        stroke-opacity="0.8"
        filter="url(#magentaGlow)"
      >F</text>

      <!-- Crisp Foreground Monogram Letters -->
      <text
        x="20"
        y="120"
        font-family="'Playfair Display', 'Bodoni MT', Georgia, serif"
        font-size="125"
        font-weight="700"
        fill="url(#letterGrad)"
      >S</text>

      <text
        x="62"
        y="120"
        font-family="'Playfair Display', 'Bodoni MT', Georgia, serif"
        font-size="125"
        font-weight="700"
        fill="url(#letterGrad)"
      >F</text>

      <!-- Intertwined Ribbon / Script Swash through Monogram -->
      <path
        d="M 12,125 C 28,110 32,70 52,50 C 65,35 80,45 88,68 C 96,92 105,120 122,105 C 132,95 125,75 110,65"
        fill="none"
        stroke="url(#brandMagentaGrad)"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-dasharray="1 0.5"
        opacity="0.95"
        filter="url(#magentaGlow)"
      />
    </g>

    <!-- ==========================================
         RIGHT SIDE: SRI SUBHAKARI (TOP) + FASHIONS (DOWN)
         ========================================== -->
    <g transform="translate(170, 0)">
      <!-- 1. TOP LINE: Sri Subhakari -->
      <!-- Magenta glow silhouette -->
      <text
        x="10"
        y="78"
        font-family="'Playfair Display', 'Bodoni MT', Didot, Georgia, serif"
        font-size="50"
        font-weight="800"
        letter-spacing="1"
        fill="none"
        stroke="#ec4899"
        stroke-width="3"
        stroke-opacity="0.5"
        filter="url(#magentaGlow)"
      >Sri Subhakari</text>

      <!-- Crisp Foreground: Sri Subhakari -->
      <text
        x="10"
        y="78"
        font-family="'Playfair Display', 'Bodoni MT', Didot, Georgia, serif"
        font-size="50"
        font-weight="800"
        letter-spacing="1"
        fill="url(#letterGrad)"
      >Sri Subhakari</text>

      <!-- 2. DOWN / BOTTOM LINE: FASHIONS -->
      <!-- Magenta glow silhouette -->
      <text
        x="12"
        y="124"
        font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif"
        font-size="26"
        font-weight="900"
        letter-spacing="10"
        fill="none"
        stroke="#d946ef"
        stroke-width="3"
        stroke-opacity="0.5"
        filter="url(#magentaGlow)"
      >FASHIONS</text>

      <!-- Front Rose-Magenta: FASHIONS -->
      <text
        x="12"
        y="124"
        font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif"
        font-size="26"
        font-weight="900"
        letter-spacing="10"
        fill="url(#brandMagentaGrad)"
      >FASHIONS</text>

      <!-- Delicate Botanical Accent Leaf on Fashions -->
      <g transform="translate(230, 96) scale(0.65)" opacity="0.9">
        <path d="M 5,45 Q 12,25 6,5 Q 15,15 18,0" fill="none" stroke="#f472b6" stroke-width="1.2" />
        <path d="M 7,32 Q 15,30 14,24 Q 8,26 7,32 Z" fill="url(#brandMagentaGrad)" />
        <path d="M 6,18 Q -2,14 -1,8 Q 5,12 6,18 Z" fill="url(#brandMagentaGrad)" />
        <circle cx="18" cy="0" r="1.5" fill="#ffffff" filter="url(#softGlow)" />
      </g>

      <!-- 3. Subtitle / Tagline -->
      <g transform="translate(14, 154)">
        <text
          x="0"
          y="0"
          font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif"
          font-size="10.5"
          font-weight="700"
          letter-spacing="5"
          fill="#fbcfe8"
          opacity="0.9"
        >PRECISION IN EVERY DETAIL</text>

        <!-- Delicate Underline -->
        <line x1="0" y1="5" x2="260" y2="5" stroke="url(#goldScriptGrad)" stroke-width="0.8" opacity="0.5" />
      </g>
    </g>
  </g>
</svg>
